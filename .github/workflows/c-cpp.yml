name: Build MSVC Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'
        msbuild-architecture: x64

    - name: Build solution
      run: msbuild WinAmy.sln /p:Configuration=Release /p:Platform=x64 /m
